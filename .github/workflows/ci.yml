name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitabu
          POSTGRES_PASSWORD: vitabu
          POSTGRES_DB: vitabu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitabu -d vitabu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VITABU_TEST_POSTGRES: Host=localhost;Port=5432;Database=vitabu;Username=vitabu;Password=vitabu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Vitabu.slnx
      - name: Build
        run: dotnet build Vitabu.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Vitabu.slnx -c Release --no-build --verbosity normal

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  contract:
    name: Contract present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenAPI Identity + Listings ops
        run: |
          test -f contract/openapi.yaml
          grep -q "operationId: getHealth" contract/openapi.yaml
          grep -q "operationId: register" contract/openapi.yaml
          grep -q "operationId: requestPhoneOtp" contract/openapi.yaml
          grep -q "operationId: listListings" contract/openapi.yaml
          grep -q "operationId: getListing" contract/openapi.yaml
          grep -q "Problem:" contract/openapi.yaml
          grep -q "bearerAuth:" contract/openapi.yaml
