openapi: 3.1.0
info:
  title: Vitabu Vitabu API
  version: 0.8.0
  description: |
    Contract-first API for Vitabu Vitabu (Kenya CBC parent marketplace).
    Wire format: snake_case JSON, enums as snake_case strings, datetimes ISO-8601 UTC (*_utc).
    Error envelope: Problem.
servers:
  - url: http://localhost:5080
    description: Local API
tags:
  - name: System
    description: Health and meta
  - name: Auth
    description: Register, login, session, password reset, phone OTP
  - name: Catalog
    description: CBC taxonomy facets and titles
  - name: Listings
    description: Marketplace listings (public read + authenticated sell)
  - name: Deals
    description: Interest / arrange / reserve between buyer and seller
  - name: Notifications
    description: In-app notifications (email fan-out on key deal events)
  - name: Wishlist
    description: Save listings for later
  - name: Admin
    description: Staff moderation (hide listings, resolve reports)
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create parent account and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Email + password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request password reset email (always 202 to avoid email enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/Problem"

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/Problem"

  /auth/phone/request-otp:
    post:
      tags: [Auth]
      operationId: requestPhoneOtp
      summary: Send SMS OTP to verify phone (dev may return dev_code)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPhoneOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPhoneOtpResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /auth/phone/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyPhoneOtp
      summary: Verify SMS OTP and mark phone verified
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPhoneOtpRequest"
      responses:
        "200":
          description: Phone verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"

  /catalog/facets:
    get:
      tags: [Catalog]
      operationId: getCatalogFacets
      summary: Filter facets for browse UI
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFacets"

  /catalog/titles:
    get:
      tags: [Catalog]
      operationId: searchCatalogTitles
      summary: CBC title search for smart sell input
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: grade
          in: query
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Page of CBC titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcTitlePage"

  /listings:
    get:
      tags: [Listings]
      operationId: listListings
      summary: Browse Active listings (mixture of intents)
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: grade
          in: query
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
          description: Soft geo filter; omit for all Kenya
        - name: intent
          in: query
          schema:
            $ref: "#/components/schemas/ListingIntent"
        - name: condition
          in: query
          schema:
            $ref: "#/components/schemas/BookCondition"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Page of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPage"
    post:
      tags: [Listings]
      operationId: createListing
      summary: Publish a listing (instant Active; phone verified required)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /listings/{id}:
    get:
      tags: [Listings]
      operationId: getListing
      summary: Listing detail for SEO and arrange CTA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Listings]
      operationId: updateListing
      summary: Update own editable listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /listings/{id}/pause:
    post:
      tags: [Listings]
      operationId: pauseListing
      summary: Pause own active listing (hides from browse)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paused listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /listings/{id}/resume:
    post:
      tags: [Listings]
      operationId: resumeListing
      summary: Resume own paused listing to Active
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumed listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /me/listings:
    get:
      tags: [Listings]
      operationId: listMyListings
      summary: Listings owned by the current user (all statuses)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Page of own listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPage"
        "401":
          $ref: "#/components/responses/Problem"

  /me/listings/{id}:
    get:
      tags: [Listings]
      operationId: getMyListing
      summary: Own listing detail for edit (includes paused)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Own listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /media/image-stub:
    post:
      tags: [Listings]
      operationId: createImageStub
      summary: Return a placeholder cover image URL (MinIO later)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageStubRequest"
      responses:
        "200":
          description: Stub URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageStubResponse"
        "401":
          $ref: "#/components/responses/Problem"

  /listings/{listingId}/interests:
    post:
      tags: [Deals]
      operationId: createInterest
      summary: Send arrange/interest request (phone verified; listing stays Active)
      security:
        - bearerAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterestRequest"
      responses:
        "201":
          description: Interest created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /me/interests:
    get:
      tags: [Deals]
      operationId: listMyInterests
      summary: Buyer interest inbox
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Page of interests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestPage"
        "401":
          $ref: "#/components/responses/Problem"

  /me/listings/{listingId}/interests:
    get:
      tags: [Deals]
      operationId: listListingInterests
      summary: Seller inbox of interests for one listing
      security:
        - bearerAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Page of interests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestPage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /interests/{id}:
    get:
      tags: [Deals]
      operationId: getInterest
      summary: Interest/deal detail (phones only when Accepted)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Interest detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /interests/{id}/accept:
    post:
      tags: [Deals]
      operationId: acceptInterest
      summary: Seller accepts one interest → listing reserved
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Accepted interest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /interests/{id}/decline:
    post:
      tags: [Deals]
      operationId: declineInterest
      summary: Seller declines an interest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Declined interest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /interests/{id}/cancel:
    post:
      tags: [Deals]
      operationId: cancelInterest
      summary: Buyer cancels pending/waitlisted interest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled interest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /interests/{id}/release:
    post:
      tags: [Deals]
      operationId: releaseInterest
      summary: Release accepted reserve → listing Active again
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Released interest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /interests/{id}/complete:
    post:
      tags: [Deals]
      operationId: completeInterest
      summary: Dual-confirm completion (both parties must confirm)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Interest after this party's confirm (Completed when both done)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /interests/{id}/dispute:
    post:
      tags: [Deals]
      operationId: disputeInterest
      summary: Open a dispute on an accepted deal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Disputed interest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /interests/{id}/rate:
    post:
      tags: [Deals]
      operationId: rateInterest
      summary: Rate the other party after completed (1-5)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  nullable: true
      responses:
        "204":
          description: Rated
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /listings/{listingId}/reports:
    post:
      tags: [Deals]
      operationId: reportListing
      summary: Report a listing for staff review
      security:
        - bearerAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                details:
                  type: string
                  nullable: true
      responses:
        "204":
          description: Report accepted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /admin/listings:
    get:
      tags: [Admin]
      operationId: adminListListings
      summary: Staff list listings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Admin listing page
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /admin/listings/{id}/hide:
    post:
      tags: [Admin]
      operationId: adminHideListing
      summary: Staff hide a listing from browse
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Hidden
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /admin/reports:
    get:
      tags: [Admin]
      operationId: adminListReports
      summary: Staff report queue
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: open
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Report page
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /admin/reports/{id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveReport
      summary: Dismiss report or hide listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [dismiss, hide]
      responses:
        "204":
          description: Resolved
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: In-app notification inbox
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Notifications page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Problem"

  /me/notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Marked read
        "401":
          $ref: "#/components/responses/Problem"

  /me/wishlist:
    get:
      tags: [Wishlist]
      operationId: listMyWishlist
      summary: Listings saved by the current user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Wishlist page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistPage"
        "401":
          $ref: "#/components/responses/Problem"

  /listings/{id}/wishlist:
    get:
      tags: [Wishlist]
      operationId: getWishlistStatus
      summary: Whether the current user has saved this listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wishlist status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistStatus"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Wishlist]
      operationId: addToWishlist
      summary: Save listing to wishlist (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Wishlist]
      operationId: removeFromWishlist
      summary: Remove listing from wishlist (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from register/login. Not required for /health.
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: validation_failed
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
    Page:
      type: object
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    HealthStatus:
      type: object
      required: [status, service, utc]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        utc:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        [display_name, email, password, city, accept_terms, confirm_parent_guardian]
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        city:
          type: string
          minLength: 2
          maxLength: 80
        accept_terms:
          type: boolean
          description: Must be true
        confirm_parent_guardian:
          type: boolean
          description: Must be true — 18+ / parent-guardian
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    RequestPhoneOtpRequest:
      type: object
      required: [phone_e164]
      properties:
        phone_e164:
          type: string
          description: Kenya mobile in E.164, e.g. +254712345678
          pattern: "^\\+2547\\d{8}$"
    VerifyPhoneOtpRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^\\d{6}$"
    UserProfile:
      type: object
      required:
        [
          id,
          display_name,
          email,
          city,
          phone_verified,
          email_verified,
          is_staff,
          created_at_utc,
        ]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        city:
          type: string
        phone_e164:
          type: string
          nullable: true
        phone_verified:
          type: boolean
        phone_verified_at_utc:
          type: string
          format: date-time
          nullable: true
        email_verified:
          type: boolean
        is_staff:
          type: boolean
        created_at_utc:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until expiry
        user:
          $ref: "#/components/schemas/UserProfile"
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    RequestPhoneOtpResponse:
      type: object
      required: [message, expires_in_seconds]
      properties:
        message:
          type: string
        expires_in_seconds:
          type: integer
        dev_code:
          type: string
          nullable: true
          description: Present only in Development for mock SMS
    ListingIntent:
      type: string
      enum: [sale, free, exchange, donate_school]
    BookCondition:
      type: string
      enum: [like_new, good, fair, writing_inside]
    ListingStatus:
      type: string
      enum: [draft, active, reserved, sold, given, exchanged, donated, paused, hidden]
    CatalogFacets:
      type: object
      required: [grades, subjects, cities, intents, conditions]
      properties:
        grades:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
        cities:
          type: array
          items:
            type: string
        intents:
          type: array
          items:
            $ref: "#/components/schemas/ListingIntent"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/BookCondition"
    SellerSnippet:
      type: object
      required: [display_name, city]
      properties:
        display_name:
          type: string
        city:
          type: string
    ListingCard:
      type: object
      required:
        [id, title, grade, subject, city, intent, condition, status, created_at_utc]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        grade:
          type: string
        subject:
          type: string
        term:
          type: string
          nullable: true
        city:
          type: string
        intent:
          $ref: "#/components/schemas/ListingIntent"
        condition:
          $ref: "#/components/schemas/BookCondition"
        status:
          $ref: "#/components/schemas/ListingStatus"
        price_kes:
          type: number
          format: double
          nullable: true
        cover_image_url:
          type: string
          nullable: true
        interest_count:
          type: integer
          minimum: 0
        created_at_utc:
          type: string
          format: date-time
    ListingDetail:
      allOf:
        - $ref: "#/components/schemas/ListingCard"
        - type: object
          required: [description, seller, slug]
          properties:
            description:
              type: string
            slug:
              type: string
            seller:
              $ref: "#/components/schemas/SellerSnippet"
    ListingPage:
      type: object
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListingCard"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    CbcTitleCard:
      type: object
      required: [id, code, title, grade, subject, term, material_type, language]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        grade:
          type: string
        subject:
          type: string
        term:
          type: string
        material_type:
          type: string
        language:
          type: string
    CbcTitlePage:
      type: object
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CbcTitleCard"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    CreateListingRequest:
      type: object
      required:
        [
          title,
          grade,
          subject,
          city,
          intent,
          condition,
          description,
          cover_image_url,
        ]
      properties:
        cbc_title_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 200
        grade:
          type: string
          maxLength: 40
        subject:
          type: string
          maxLength: 80
        term:
          type: string
          maxLength: 40
          nullable: true
        city:
          type: string
          maxLength: 80
        intent:
          $ref: "#/components/schemas/ListingIntent"
        condition:
          $ref: "#/components/schemas/BookCondition"
        price_kes:
          type: number
          format: double
          nullable: true
          description: Required when intent is sale; must be null for free/exchange
        description:
          type: string
          maxLength: 4000
        cover_image_url:
          type: string
          maxLength: 500
          description: Stub URL OK until MinIO upload lands
    UpdateListingRequest:
      allOf:
        - $ref: "#/components/schemas/CreateListingRequest"
    ImageStubRequest:
      type: object
      properties:
        filename:
          type: string
          nullable: true
    ImageStubResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    InterestStatus:
      type: string
      enum: [pending, accepted, waitlisted, declined, cancelled, completed, disputed]
    HandoffMode:
      type: string
      enum: [meetup, pickup_mtaani]
    CreateInterestRequest:
      type: object
      required: [handoff_mode, city]
      properties:
        handoff_mode:
          $ref: "#/components/schemas/HandoffMode"
        city:
          type: string
          maxLength: 80
        message:
          type: string
          maxLength: 2000
          nullable: true
    PartySnippet:
      type: object
      required: [id, display_name, city]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        city:
          type: string
        phone_e164:
          type: string
          nullable: true
          description: Present only when interest status is accepted
    InterestDetail:
      type: object
      required:
        [
          id,
          listing_id,
          listing_title,
          listing_intent,
          status,
          handoff_mode,
          city,
          created_at_utc,
          buyer,
          seller,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        listing_title:
          type: string
        listing_intent:
          $ref: "#/components/schemas/ListingIntent"
        status:
          $ref: "#/components/schemas/InterestStatus"
        handoff_mode:
          $ref: "#/components/schemas/HandoffMode"
        city:
          type: string
        message:
          type: string
          nullable: true
        created_at_utc:
          type: string
          format: date-time
        accepted_at_utc:
          type: string
          format: date-time
          nullable: true
        reserved_until_utc:
          type: string
          format: date-time
          nullable: true
        buyer_completed_at_utc:
          type: string
          format: date-time
          nullable: true
        seller_completed_at_utc:
          type: string
          format: date-time
          nullable: true
        dispute_reason:
          type: string
          nullable: true
        buyer:
          $ref: "#/components/schemas/PartySnippet"
        seller:
          $ref: "#/components/schemas/PartySnippet"
    InterestCard:
      type: object
      required:
        [
          id,
          listing_id,
          listing_title,
          status,
          handoff_mode,
          city,
          buyer_display_name,
          created_at_utc,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        listing_title:
          type: string
        status:
          $ref: "#/components/schemas/InterestStatus"
        handoff_mode:
          $ref: "#/components/schemas/HandoffMode"
        city:
          type: string
        buyer_display_name:
          type: string
        created_at_utc:
          type: string
          format: date-time
        reserved_until_utc:
          type: string
          format: date-time
          nullable: true
    InterestPage:
      type: object
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InterestCard"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    NotificationItem:
      type: object
      required: [id, type, title, body, created_at_utc]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        related_entity_id:
          type: string
          format: uuid
          nullable: true
        created_at_utc:
          type: string
          format: date-time
        read_at_utc:
          type: string
          format: date-time
          nullable: true
    NotificationPage:
      type: object
      required: [items, page, page_size, total_items, total_pages, unread_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        unread_count:
          type: integer
    WishlistStatus:
      type: object
      required: [on_wishlist]
      properties:
        on_wishlist:
          type: boolean
    WishlistItem:
      type: object
      required: [listing_id, saved_at_utc, listing]
      properties:
        listing_id:
          type: string
          format: uuid
        saved_at_utc:
          type: string
          format: date-time
        listing:
          $ref: "#/components/schemas/ListingCard"
    WishlistPage:
      type: object
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WishlistItem"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
